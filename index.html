<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DINGO — Layanan Kendaraan Dinas ESDM Jatim</title>
<meta name="description" content="Digitalisasi Layanan Kendaraan Dinas Terintegrasi Online, Dinas Energi dan Sumber Daya Mineral Provinsi Jawa Timur.">
<meta name="theme-color" content="#04141C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="assets/logo-esdm.png">
<link rel="apple-touch-icon" href="assets/logo-esdm.png">
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    background: #04141C;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /*
    Safari iOS mengabaikan overflow pada iframe dan memaksanya setinggi
    seluruh isi. Akibatnya bilah atas aplikasi ikut hanyut dan halaman
    terasa melompat saat digulir. Bungkus inilah yang menggulir, bukan
    iframe-nya, sehingga perilakunya sama di Android dan iPhone.
  */
  #panggung {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: none;
  }

  #bingkai {
    display: block;
    width: 1px; min-width: 100%;   /* Trik lebar penuh untuk iOS. */
    height: 100%;
    border: 0;
  }

  #tunggu {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #04141C; color: #8FA9B6;
    font: 500 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: opacity .45s ease;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #tunggu[hidden] { display: none; }
  #tunggu.pudar { opacity: 0; pointer-events: none; }

  .putar {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(229,169,79,.25); border-top-color: #E5A94F;
    animation: putar .8s linear infinite;
  }
  @keyframes putar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .putar { animation-duration: 2.4s; } }
</style>
</head>
<body>

<div id="tunggu">
  <div class="putar"></div>
  <div>Memuat DINGO…</div>
</div>

<div id="panggung">
  <iframe
    id="bingkai"
    title="Aplikasi DINGO"
    src="https://script.google.com/macros/s/AKfycbz5S-izTUEB_fzJt5DuO407lUEGM8CarxRMf18MeBSSaBBf07DRyMQFmjkM4dNcGexS/exec"
    allow="camera; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<script>
(function () {
  var tunggu = document.getElementById('tunggu');
  var bingkai = document.getElementById('bingkai');
  var sudah = false;

  function sembunyikan() {
    if (sudah) return;
    sudah = true;
    tunggu.classList.add('pudar');
    setTimeout(function () { tunggu.hidden = true; }, 500);
  }

  bingkai.addEventListener('load', sembunyikan);
  setTimeout(sembunyikan, 12000); // Jaring pengaman bila peristiwa load tidak terkirim.
})();
</script>

</body>
</html>
